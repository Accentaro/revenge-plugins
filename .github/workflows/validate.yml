name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run prepare:tools
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: npm run generate-index -- --dist build/dist --base-url https://example.invalid/pool --out build/index.json
